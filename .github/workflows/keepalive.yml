name: Keep Supabase Alive

on:
  schedule:
    # Run every 3 days at 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          # We ping a dedicated 'keepalive' table because querying RLS-protected tables 
          # like 'cv_documents' as anon returns 0 rows, which Supabase DOES NOT count as activity.
          curl -f -sS -X GET "$SUPABASE_URL/rest/v1/keepalive?select=id&limit=1" \
          -H "apikey: $SUPABASE_ANON_KEY" > /dev/null
        env:
          SUPABASE_URL: "https://qlqmsspabxvkpjvhbwgs.supabase.co"
          SUPABASE_ANON_KEY: "sb_publishable_fo-ct_fWHCJNjpimZYLiyA_5q_IAgSH"
